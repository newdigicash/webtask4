services:
  # base de datos
  mysql_db:
    image: mysql:8.4
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: pass1234
      MYSQL_DATABASE: pedidosdb
      MYSQL_USER: usuariodb
      MYSQL_PASSWORD: pass1234
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/esquema.sql:/docker-entrypoint-initdb.d/esquema.sql
    networks:
      - app-network

  # administrador db
  adminer:
    image: adminer:latest
    container_name: adminer_ui
    restart: always
    ports:
      - "8081:8080"
    networks:
      - app-network

  # configura punto net
  dotnet_app:
    # para prod
    build:
      context: .
      dockerfile: Dockerfile
    # para desarrollo
    #image: mcr.microsoft.com/dotnet/sdk:10.0
    #volumes:
    #  - .:/CrudPedido
    #command: tail -f /dev/null
    container_name: dotnet_web_api
    restart: always
    ports:
      - "5080:5080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5080
      - ConnectionStrings__DefaultConnection=Server=mysql_db;Port=3306;Database=pedidosdb;Uid=usuariodb;Pwd=pass1234;
    depends_on:
      - mysql_db
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
